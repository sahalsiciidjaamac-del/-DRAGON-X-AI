
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>DRAGON X AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;text-align:center;
 background:#111;border-bottom:1px solid #292929;
}
.logo{
 color:#ff2525;font-size:48px;
 font-weight:900;
}
header h1{margin:3px;font-size:25px}
header h1 span{color:#ff2525}
header p{color:#aaa;font-size:12px}
nav{
 display:flex;justify-content:center;
 gap:9px;padding:15px;flex-wrap:wrap;
}
nav button{
 background:#202020;color:white;
 border:1px solid #444;border-radius:20px;
 padding:10px 15px;
}
nav button.active{background:#e51d2a;border:0}
main{max-width:750px;margin:20px auto;padding:15px}
.welcome{text-align:center;margin:35px 0}
.welcome h2{font-size:27px}
.welcome span{color:#ff2525}
.welcome p{color:#aaa}
#chat{
 min-height:180px;max-height:400px;
 overflow-y:auto;padding:12px;
 background:#111;border:1px solid #292929;
 border-radius:12px;
}
.message{
 padding:12px;margin:10px 0;
 border-radius:10px;line-height:1.5;
 white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{background:#292020;text-align:right}
.ai{background:#202020;border-left:3px solid #ed2525}
.input-area{margin-top:15px}
textarea{
 width:100%;height:110px;padding:15px;
 background:#171717;color:white;
 border:1px solid #444;border-radius:12px;
 font-size:16px;resize:vertical;
}
#send{
 width:100%;padding:15px;margin-top:10px;
 background:#e51d2a;color:white;
 border:0;border-radius:10px;
 font-size:16px;font-weight:bold;
}
#send:disabled{opacity:.5}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
</style>
</head>

<body>
<header>
 <div class="logo">X</div>
 <h1>DRAGON <span>X</span> AI</h1>
 <p>YOUR INTELLIGENT AI CODING ASSISTANT</p>
</header>

<nav>
 <button class="active" onclick="setMode('chat',this)">AI Chat</button>
 <button onclick="setMode('code',this)">Code Generator</button>
 <button onclick="setMode('website',this)">Website Builder</button>
 <button onclick="setMode('app',this)">App Builder</button>
</nav>

<main>
 <div class="welcome">
  <h2>WELCOME TO <span>DRAGON X AI</span></h2>
  <p>What do you want to create today?</p>
 </div>

 <div id="chat">
  <div class="message ai">
   Hello! I am DRAGON X AI.
   Ask me anything about coding, websites and apps.
  </div>
 </div>

 <div class="input-area">
  <textarea id="prompt" placeholder="Ask DRAGON X AI anything..."></textarea>
  <button id="send" onclick="sendMessage()">START AI →</button>
 </div>
</main>

<footer>
 DRAGON X AI © 2026 | Powered by Gemini
</footer>

<script>
let currentMode="chat";
let history=[];

function setMode(mode,button){
 currentMode=mode;
 document.querySelectorAll("nav button").forEach(b=>{
  b.classList.remove("active");
 });
 button.classList.add("active");
}

function addMessage(text,type){
 const chat=document.getElementById("chat");
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
 const input=document.getElementById("prompt");
 const button=document.getElementById("send");
 const message=input.value.trim();

 if(!message)return;

 addMessage(message,"user");
 input.value="";
 button.disabled=true;
 button.textContent="THINKING...";

 const loading=document.createElement("div");
 loading.className="message ai";
 loading.textContent="DRAGON X AI is thinking...";
 document.getElementById("chat").appendChild(loading);

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:message,
    mode:currentMode,
    history:history
   })
  });

  const data=await response.json();
  loading.remove();

  if(!response.ok){
   addMessage(data.error || "Something went wrong.","ai");
  }else{
   const answer=data.answer || "No answer received.";
   addMessage(answer,"ai");

   history.push(
    {role:"user",text:message},
    {role:"model",text:answer}
   );
   history=history.slice(-12);
  }

 }catch(error){
  loading.remove();
  addMessage("Connection error. Please try again.","ai");
 }

 button.disabled=false;
 button.textContent="START AI →";
}

document.getElementById("prompt").addEventListener("keydown",function(e){
 if(e.key==="Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>
</body>
</html>
